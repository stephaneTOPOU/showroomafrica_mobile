plugins {
    id 'com.android.application'
}

def MYAPP_RELEASE_STORE_FILE = project.hasProperty('MYAPP_RELEASE_STORE_FILE') ? file(MYAPP_RELEASE_STORE_FILE) : null
def MYAPP_RELEASE_STORE_PASSWORD = project.hasProperty('MYAPP_RELEASE_STORE_PASSWORD') ? MYAPP_RELEASE_STORE_PASSWORD : ""
def MYAPP_RELEASE_KEY_ALIAS = project.hasProperty('MYAPP_RELEASE_KEY_ALIAS') ? MYAPP_RELEASE_KEY_ALIAS : ""
def MYAPP_RELEASE_KEY_PASSWORD = project.hasProperty('MYAPP_RELEASE_KEY_PASSWORD') ? MYAPP_RELEASE_KEY_PASSWORD : ""

android {
    namespace 'com.showroomafrica.annuaire'
    compileSdkVersion 36


    signingConfigs {
        release {
            storeFile MYAPP_RELEASE_STORE_FILE
            storePassword MYAPP_RELEASE_STORE_PASSWORD
            keyAlias MYAPP_RELEASE_KEY_ALIAS
            keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }

    defaultConfig {
        applicationId "com.showroomafrica.annuaire"
        minSdk 27
        targetSdk 36
        versionCode 12
        versionName "2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['fr'] // Pour réduire la taille (langue française uniquement)
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.2"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.2"
}
